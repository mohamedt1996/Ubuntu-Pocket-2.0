# Put this ONE file at: .github/workflows/build.yml
name: Build Debian Pocket IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  UTM_TAG: "v4.7.5"   # QEMU from this UTM release (the JIT hooks were checked against it)

jobs:
  disk-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test JIT allocation contract
        run: python3 tests/check-jit-contract.py
      - name: Test Docker probe error handling
        run: python3 tests/check-docker-probe.py
      - name: Test debugger status handling
        run: python3 tests/check-detach-status.py
      - name: Build Debian 13 arm64 disk with Docker
        run: bash build-image.sh "$GITHUB_WORKSPACE/vm"
      - name: Verify Linux boot and Docker before packaging
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-arm
          python3 -u smoke-boot.py vm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-boot-diagnostics
          path: vm/smoke-*.log
      - name: Pack
        run: tar -C vm -cf vm.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: vm
          path: vm.tar
          compression-level: 0

  qemu:
    # Reuse QEMU that UTM already compiled for iOS instead of building it (saves 1-2 hours)
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download prebuilt UTM.ipa
        run: |
          TAG="${UTM_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/utmapp/UTM/releases --jq '[.[] | select(any(.assets[]; .name=="UTM.ipa"))][0].tag_name')
          fi
          test "$TAG" = "v4.7.5"
          echo "Using UTM $TAG"
          gh release download "$TAG" --repo utmapp/UTM --pattern UTM.ipa
      - name: Extract QEMU frameworks and data
        run: |
          unzip -q UTM.ipa -d utm
          APP=$(ls -d utm/Payload/*.app | head -1)
          python3 - "$APP/Info.plist" <<'PYCODE'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              version = plistlib.load(f)['CFBundleShortVersionString']
          assert version == '4.7.5', f'Unexpected UTM version: {version}'
          PYCODE
          ls "$APP/Frameworks"
          mkdir -p out/Frameworks out/share/qemu
          for f in "$APP"/Frameworks/*; do
            n=$(basename "$f")
            case "$n" in
              qemu-*-softmmu*|libqemu-*-softmmu*)
                [[ "$n" == *aarch64-softmmu* ]] && cp -R "$f" out/Frameworks/ ;;
              *) cp -R "$f" out/Frameworks/ ;;
            esac
          done
          ls out/Frameworks | grep -q aarch64-softmmu || { echo "aarch64 QEMU not found in UTM.ipa"; exit 1; }
          FD=$(find "$APP" -name 'edk2-aarch64-code.fd' | head -1)
          if [ -n "$FD" ]; then cp -R "$(dirname "$FD")"/. out/share/qemu/; fi
          ls -la out/share/qemu | head
          tar -cf qemu-out.tar -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: qemu
          path: qemu-out.tar

  app:
    needs: [disk-image, qemu]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: vm }
      - uses: actions/download-artifact@v4
        with: { name: qemu }
      - name: Arrange flat repo into an Xcode project
        run: |
          brew install xcodegen
          mkdir -p App
          # Copy ONLY this app's files, so other files in the repo can't interfere
          cp UbuntuPocketApp.swift VMManager.swift TerminalScreen.swift JIT.swift JIT26.c JIT26.h App/
          xcodegen generate
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.5" App/Info.plist
      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project UbuntuPocket.xcodeproj -scheme UbuntuPocket \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log || {
              echo "=================== COMPILER ERRORS ==================="
              grep -E "error:|\*\* BUILD FAILED" -A3 build.log | head -80
              exit 1
            }
      - name: Add QEMU and Debian into the app, package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/UbuntuPocket.app
          mkdir -p qemu-out vm "$APP/Frameworks" "$APP/qemu" "$APP/VM"
          tar -xf qemu-out.tar -C qemu-out
          tar -xf vm.tar -C vm
          cp -R qemu-out/Frameworks/* "$APP/Frameworks/"
          cp -R qemu-out/share/qemu/. "$APP/qemu/"
          cp vm/Image vm/initrd vm/disk.qcow2 "$APP/VM/"
          printf 'source=%s\nutm=v4.7.5\nrevision=bootfix-5\n' "$GITHUB_SHA" > "$APP/VM/build-info.txt"
          mkdir Payload && cp -R "$APP" Payload/
          zip -qr -1 -y DebianPocket.ipa Payload
          ls -lh DebianPocket.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: DebianPocket.ipa
          path: DebianPocket.ipa
          compression-level: 0
      - name: Publish release (easy download on iPhone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Debian Pocket build ${{ github.run_number }}
          files: DebianPocket.ipa
