# Put this ONE file at: .github/workflows/build.yml
name: Build Ubuntu Pocket IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  UTM_TAG: ""   # empty = newest UTM release; or set e.g. v5.0.1

jobs:
  ubuntu-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Ubuntu arm64 disk with Docker
        run: bash build-image.sh "$GITHUB_WORKSPACE/vm"
      - name: Pack
        run: tar -C vm -cf vm.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: vm
          path: vm.tar
          compression-level: 0

  qemu:
    # Reuse QEMU that UTM already compiled for iOS instead of building it (saves 1-2 hours)
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download prebuilt UTM.ipa
        run: |
          TAG="${UTM_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/utmapp/UTM/releases --jq '[.[] | select(any(.assets[]; .name=="UTM.ipa"))][0].tag_name')
          fi
          echo "Using UTM $TAG"
          gh release download "$TAG" --repo utmapp/UTM --pattern UTM.ipa
      - name: Extract QEMU frameworks and data
        run: |
          unzip -q UTM.ipa -d utm
          APP=$(ls -d utm/Payload/*.app | head -1)
          ls "$APP/Frameworks"
          mkdir -p out/Frameworks out/share/qemu
          for f in "$APP"/Frameworks/*; do
            n=$(basename "$f")
            case "$n" in
              qemu-*-softmmu*|libqemu-*-softmmu*)
                [[ "$n" == *aarch64-softmmu* ]] && cp -R "$f" out/Frameworks/ ;;
              *) cp -R "$f" out/Frameworks/ ;;
            esac
          done
          ls out/Frameworks | grep -q aarch64-softmmu || { echo "aarch64 QEMU not found in UTM.ipa"; exit 1; }
          FD=$(find "$APP" -name 'edk2-aarch64-code.fd' | head -1)
          if [ -n "$FD" ]; then cp -R "$(dirname "$FD")"/. out/share/qemu/; fi
          ls -la out/share/qemu | head
          tar -cf qemu-out.tar -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: qemu
          path: qemu-out.tar

  app:
    needs: [ubuntu-image, qemu]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: vm }
      - uses: actions/download-artifact@v4
        with: { name: qemu }
      - name: Arrange flat repo into an Xcode project
        run: |
          brew install xcodegen
          mkdir -p App
          cp *.swift *.c *.h App/
          xcodegen generate
      - name: Build app (unsigned)
        run: |
          xcodebuild -project UbuntuPocket.xcodeproj -scheme UbuntuPocket \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Add QEMU and Ubuntu into the app, package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/UbuntuPocket.app
          mkdir -p qemu-out vm "$APP/Frameworks" "$APP/qemu" "$APP/VM"
          tar -xf qemu-out.tar -C qemu-out
          tar -xf vm.tar -C vm
          cp -R qemu-out/Frameworks/* "$APP/Frameworks/"
          cp -R qemu-out/share/qemu/. "$APP/qemu/"
          cp vm/Image vm/initrd vm/disk.qcow2 "$APP/VM/"
          mkdir Payload && cp -R "$APP" Payload/
          zip -qr -1 -y UbuntuPocket.ipa Payload
          ls -lh UbuntuPocket.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: UbuntuPocket-ipa
          path: UbuntuPocket.ipa
          compression-level: 0
      - name: Publish release (easy download on iPhone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ubuntu Pocket build ${{ github.run_number }}
          files: UbuntuPocket.ipa
